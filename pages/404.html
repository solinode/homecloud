<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · HomeCloud</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site.css">
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center; }
  .nf h1 { font-size: clamp(2rem, 6vw, 3.25rem); letter-spacing: -0.03em; margin: 12px 0 8px; }
  .nf p { color: var(--muted, #a1a1aa); margin: 0 0 24px; }
  .nf .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .nf a.btn { display: inline-block; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border, rgba(255,255,255,.12)); text-decoration: none; color: inherit; }
  .nf code { font-family: var(--mono, ui-monospace, monospace); opacity: .7; }
</style>
</head>
<body>
<main class="nf">
  <div>
    <img src="/favicon.svg" width="44" height="44" alt="HomeCloud">
    <h1>Page not found</h1>
    <p><code>404</code> · This page doesn't exist.</p>
    <div class="links">
      <a class="btn" href="/">HomeCloud home</a>
      <a class="btn" href="/demo/">Demo console</a>
      <a class="btn" href="https://github.com/solinode/homecloud">GitHub</a>
    </div>
  </div>
</main>
</body>
</html>
