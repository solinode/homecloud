name: Maven Central
# Publishes integrations/testcontainers-java to Maven Central as
# io.github.solinode:testcontainers-homecloud when a tag like testcontainers-java/v0.1.0 is
# pushed. The version comes from the tag. Never runs on pull requests.
#
# Required repository secrets (in the "maven-central" environment):
#   MAVEN_CENTRAL_USERNAME  user token name from https://central.sonatype.com/account
#   MAVEN_CENTRAL_PASSWORD  user token password from the same page
#   MAVEN_GPG_PRIVATE_KEY   ASCII-armored private key that signs the artifacts
#                           (gpg --armor --export-secret-keys KEYID); its public key
#                           must be on a keyserver (keys.openpgp.org or keyserver.ubuntu.com)
#   MAVEN_GPG_PASSPHRASE    passphrase of that key
# The io.github.solinode namespace must be verified in the Central Portal first.
on:
  push:
    tags:
      - "testcontainers-java/v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.github.solinode/testcontainers-homecloud
    defaults:
      run:
        working-directory: integrations/testcontainers-java
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set the version from the tag
        run: |
          version="${GITHUB_REF_NAME#testcontainers-java/v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' || { echo "::error::bad version $version"; exit 1; }
          mvn -B -ntp versions:set -DnewVersion="$version" -DgenerateBackupPoms=false
      # The tests need Docker and a HomeCloud image; they run in testcontainers.yml.
      - name: Deploy
        run: mvn -B -ntp -Prelease -DskipTests deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
