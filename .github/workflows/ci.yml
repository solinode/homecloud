name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "pages/**"
      - "LICENSE"
      - ".well-known/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "pages/**"
      - "LICENSE"
      - ".well-known/**"

# A new push to a pull request (or branch) cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # AWS compatibility tests drive the real AWS CLI (preinstalled on the runner) and boto3.
      - run: pip install boto3 && aws --version
      - run: go vet ./...
      - run: go test -race ./...
        env:
          HC_TEST_PYTHON: python3
      - name: Cross-compile
        run: |
          for p in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null .
          done

  vm:
    # Boots a real virtual machine (the Ubuntu cloud image under QEMU/KVM inside a
    # Docker container) through the EC2 API and checks SSH, cloud-init user data,
    # the metadata service, stop/start, security groups and cleanup. Only this
    # test runs here; the rest of the suite is in the go job.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: VM instances
        run: go test -count=1 -timeout 40m -v -run 'TestVMInstanceLifecycle' ./internal/svc/ec2
        env:
          HC_TEST_VM: "1"

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    # Runs every service end to end against real Docker on the GitHub runner.
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Build
        run: cd cli && go build -o ../bin/homecloud .
      - name: Start HomeCloud
        run: |
          nohup ./bin/homecloud serve > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:8080/api/v1/health && break; sleep 2; done
          # Background components pull images on first start; wait for S3 (MinIO) to be ready.
          for i in $(seq 1 90); do
            grep -q "s3: MinIO ready" serve.log && break
            if grep -q "s3: " serve.log && ! grep -q "s3: MinIO ready" serve.log; then cat serve.log; echo "::error::S3 (MinIO) failed to start"; exit 1; fi
            sleep 2
          done
          grep -q "s3: MinIO ready" serve.log || { cat serve.log; echo "::error::S3 (MinIO) not ready after 3 minutes"; exit 1; }
          grep "ready" serve.log
      - name: Smoke test
        run: HC=$PWD/bin/homecloud ./scripts/smoke.sh
      - name: Server log
        if: always()
        run: cat serve.log
