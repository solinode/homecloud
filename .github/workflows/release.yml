name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make release VERSION=${GITHUB_REF_NAME#v}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v0.2.0-rc1) are pre-releases; plain tags are the latest release.
          flags="--latest"
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          # Release notes: this version's CHANGELOG section.
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v" " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "HomeCloud $GITHUB_REF_NAME" --notes-file notes.md $flags

  image:
    # The server image, ghcr.io/solinode/homecloud:<version> (and :latest for
    # plain releases), for linux/amd64 and linux/arm64. Go and the console are
    # built on the runner's platform; QEMU only runs the final stage's apk.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/solinode/homecloud
          # v0.4.0 -> 0.4.0 and latest; v0.4.0-rc1 -> 0.4.0-rc1 only.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=HomeCloud
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Version
        id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ steps.v.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
