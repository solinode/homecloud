name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make release VERSION=${GITHUB_REF_NAME#v}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v0.2.0-rc1) are pre-releases; plain tags are the latest release.
          flags="--latest"
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          # Release notes: this version's CHANGELOG section.
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v" " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "HomeCloud $GITHUB_REF_NAME" --notes-file notes.md $flags
