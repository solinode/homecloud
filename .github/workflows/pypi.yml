name: PyPI
# Publishes integrations/testcontainers-python to PyPI as testcontainers-homecloud when a
# tag like testcontainers-python/v0.1.0 is pushed. Uses PyPI Trusted Publishing (OIDC):
# no API token is stored; PyPI trusts this workflow in the "pypi" environment.
on:
  push:
    tags:
      - "testcontainers-python/v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/testcontainers-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#testcontainers-python/v}"
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$tag" = "$version" || { echo "::error::tag $tag does not match pyproject version $version"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: integrations/testcontainers-python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/testcontainers-homecloud/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
