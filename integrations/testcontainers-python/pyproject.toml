[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "testcontainers-homecloud"
version = "0.1.0"
description = "testcontainers module for HomeCloud, a self-hosted AWS"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
dependencies = ["testcontainers>=4.0", "boto3>=1.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/solinode/homecloud"
Source = "https://github.com/solinode/homecloud/tree/main/integrations/testcontainers-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
